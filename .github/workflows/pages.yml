name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-v3
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Decode binary assets
        run: |
          set -euo pipefail
          if [ -d .github/binaries ]; then
            cat .github/binaries/assets.tar.b64.* | base64 -d | tar -xvf -
          fi
          test -f assets/img/featured.webp
      - name: Prepare site
        run: |
          set -euo pipefail
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' ./ _site/
          test -f _site/index.html
          test -f _site/assets/img/featured.webp
          test -f _site/.nojekyll
      - name: Commit decoded binaries to the repo
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d .github/binaries ]; then
            rm -rf .github/binaries
          fi
          git add -A assets/img screenshots .github/binaries
          if git diff --cached --quiet; then
            echo "No binary changes to commit"
            exit 0
          fi
          git commit -m "Add decoded binary assets [skip ci]"
          git push
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
